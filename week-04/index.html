<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grey Box Homepage</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="page">
        <!-- Header -->
        <header class="header">
            <div class="logo"></div>
            <nav class="nav">
                <div class="nav-item"></div>
                <div class="nav-item"></div>
                <div class="nav-item"></div>
                <div class="nav-item"></div>
            </nav>
            <div class="header-button"></div>
        </header>
        <!-- Main Layout -->
        <main class="main">
            <!-- Sidebar -->
            <aside class="sidebar">
                <div class="side-title"></div>
                <div class="side-item"></div>
                <div class="side-item"></div>
                <div class="side-item"></div>
                <div class="side-item"></div>
                <div class="side-item"></div>
            </aside>

            <!-- Content -->
            <section class="content">

                <!-- Hero -->
                <section class="hero">
                    <div class="hero-text">
                        <div class="hero-title"></div>
                        <div class="hero-line"></div>
                        <div class="hero-line short"></div>
                        <div class="hero-button"></div>
                    </div>

                    <div class="hero-image"></div>
                </section>

                <!-- Cards -->
                <section class="cards">

                    <article class="card">
                        <div class="card-image"></div>
                        <div class="card-title"></div>
                        <div class="card-line"></div>
                        <div class="card-line short"></div>
                    </article>

                    <article class="card">
                        <div class="card-image"></div>
                        <div class="card-title"></div>
                        <div class="card-line"></div>
                        <div class="card-line short"></div>
                    </article>

                    <article class="card">
                        <div class="card-image"></div>
                        <div class="card-title"></div>
                        <div class="card-line"></div>
                        <div class="card-line short"></div>
                    </article>

                </section>

            </section>
        </main>

        <!-- Footer -->
        <footer class="footer">
            <div class="footer-box"></div>
            <div class="footer-box"></div>
            <div class="footer-box"></div>
        </footer>

    </div>

</body>
</html>
